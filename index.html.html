<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Personal Blog</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#faf8f5;--card:#fff;--text:#222;--muted:#6f6a63;--accent:#c2410c;--border:#e7e2da;--chip:#f3ede4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--card:#211e1b;--text:#efebe5;--muted:#a09a91;--accent:#fb923c;--border:#363029;--chip:#2c2722}}
:root[data-theme="dark"]{--bg:#171513;--card:#211e1b;--text:#efebe5;--muted:#a09a91;--accent:#fb923c;--border:#363029;--chip:#2c2722}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Georgia,"Times New Roman",serif;line-height:1.65}
a{color:var(--accent)}
header{border-bottom:1px solid var(--border);background:var(--card)}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
nav{display:flex;justify-content:space-between;align-items:center;padding:14px 0;font-family:system-ui,sans-serif}
nav .logo{font-weight:700;font-size:1.15rem;font-family:Georgia,serif}
nav a{margin-left:16px;text-decoration:none;color:var(--text);font-size:.95rem}
.hero{padding:28px 0 8px}
.hero h1{margin:0;font-size:2rem}
.hero p{color:var(--muted);margin:4px 0 0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 10px;font-family:system-ui,sans-serif}
.tools input,.tools select{padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:.95rem}
.tools input{flex:1;min-width:180px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;font-family:system-ui,sans-serif}
.chip{border:0;background:var(--chip);color:var(--text);padding:5px 12px;border-radius:99px;font-size:.82rem;cursor:pointer}
.chip.on{background:var(--accent);color:#fff}
.count{color:var(--muted);font:.85rem system-ui,sans-serif;margin-bottom:12px}
article{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px}
article h2{margin:0 0 4px;font-size:1.3rem}
.meta{color:var(--muted);font:.8rem system-ui,sans-serif;margin-bottom:10px}
.type{display:inline-block;background:var(--chip);border-radius:6px;padding:1px 7px;margin-right:6px;text-transform:uppercase;font-size:.7rem;letter-spacing:.04em}
article img,article video{width:100%;border-radius:8px;margin:8px 0;display:block}
article audio{width:100%;margin:8px 0}
.more{background:none;border:0;color:var(--accent);cursor:pointer;padding:0;font:.9rem system-ui,sans-serif}
.body{display:none}.open .body{display:block}.open .more-t::after{content:"Show less"}.more-t::after{content:"Read more"}
.linkcard{display:block;border:1px solid var(--border);border-radius:8px;padding:10px 12px;text-decoration:none;margin:8px 0;font-family:system-ui,sans-serif}
.empty{text-align:center;color:var(--muted);padding:30px 0;display:none}
section.profile{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px;margin:32px 0;display:flex;gap:18px;flex-wrap:wrap}
.avatar{width:96px;height:96px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font:700 2.2rem system-ui,sans-serif;flex:none}
.profile h2{margin:0 0 4px}
.contact{font-family:system-ui,sans-serif;font-size:.92rem;list-style:none;padding:0;margin:10px 0 0}
.contact li{margin:3px 0}
footer{text-align:center;color:var(--muted);font:.8rem system-ui,sans-serif;padding:20px 0 40px}
</style>
</head>
<body>
<header><div class="wrap"><nav><span class="logo" id="siteName"></span><span><a href="#posts">Posts</a><a href="#about">About</a><a href="#" id="theme">Theme</a></span></nav></div></header>
<main class="wrap">
<div class="hero"><h1 id="siteTitle"></h1><p id="siteTag"></p></div>
<div class="tools" id="posts">
<input id="q" type="search" placeholder="Search posts by title, text or tag...">
<select id="type"><option value="">All types</option><option>text</option><option>photo</option><option>audio</option><option>video</option><option>link</option></select>
<select id="sort"><option value="new">Newest first</option><option value="old">Oldest first</option></select>
</div>
<div class="chips" id="chips"></div>
<div class="count" id="count"></div>
<div id="list"></div>
<div class="empty" id="empty">No posts match your search.</div>
<section class="profile" id="about"><div class="avatar" id="avatar"></div><div style="flex:1;min-width:220px"><h2 id="pName"></h2><div id="pBio"></div><ul class="contact" id="pContact"></ul></div></section>
</main>
<footer id="foot"></footer>
<script>
/* ===== EDIT THIS SECTION ===== */
const SITE={name:"Akram",title:"Notes, sounds & pictures",tagline:"A personal blog about things I make, hear and discover."};
const PROFILE={
 name:"Akram Toshboyev",
 bio:"Shaxsiy blogimga xush kelibsiz! Men bu saytda turli mavzular haqida fikrlarim va muhim ma`lumotlarni yozib boraman.",
 contact:[["Email","toshboyev.akram.0407@gmail.com","mailto:toshboyev.akram.0407@gmail"],["Website","akramtoshboyev.com","https://example.com"],["Location","Tashkent, Uzbekistan",""]]
};
/* type: text | photo | audio | video | link. For media use your own file URLs or data URIs. */
const POSTS=[
{id:1,type:"text",date:"2026-10-05",title:"Welcome to my blog",tags:["intro","life"],
 text:"This is my first post. Replace it with your own writing. Paragraphs are separated by blank lines.\n\nSearch above to explore posts by keyword, type or tag."},
{id:2,type:"photo",date:"2026-09-28",title:"A quiet morning",tags:["photos","travel"],
 text:"Photos can sit next to a story. Change the src below to your own image file.",
 src:"data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fdba74"/><stop offset="1" stop-color="#7c2d12"/></linearGradient></defs><rect width="800" height="400" fill="url(#g)"/><circle cx="560" cy="170" r="60" fill="#fff7ed"/></svg>'),alt:"Sunrise placeholder"},
{id:3,type:"audio",date:"2026-09-15",title:"Voice note: thoughts on routines",tags:["audio","life"],
 text:"Add an MP3 or WAV file URL in the src field to publish audio.",src:""},
{id:4,type:"video",date:"2026-08-30",title:"Behind the scenes",tags:["video","projects"],
 text:"Add an MP4 or WebM file URL in the src field to publish video.",src:""},
{id:5,type:"link",date:"2026-08-12",title:"Articles worth reading",tags:["links","reading"],
 text:"A short list of things I enjoyed lately.",links:[["Example article one","https://example.com"],["Example article two","https://example.org"]]}
];
/* ===== END EDIT SECTION ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tag="";
document.title=SITE.name+" | Blog";
$("siteName").textContent=SITE.name;$("siteTitle").textContent=SITE.title;$("siteTag").textContent=SITE.tagline;
$("pName").textContent=PROFILE.name;$("pBio").textContent=PROFILE.bio;$("avatar").textContent=PROFILE.name.trim().charAt(0).toUpperCase();
$("pContact").innerHTML=PROFILE.contact.map(([l,v,h])=>`<li><b>${esc(l)}:</b> ${h?`<a href="${esc(h)}">${esc(v)}</a>`:esc(v)}</li>`).join("");
$("foot").textContent="© "+new Date().getFullYear()+" "+SITE.name;
const allTags=[...new Set(POSTS.flatMap(p=>p.tags))].sort();
function renderChips(){$("chips").innerHTML=["all",...allTags].map(t=>`<button class="chip ${(t==="all"&&!tag)||t===tag?"on":""}" data-t="${t}">${t==="all"?"All tags":"#"+esc(t)}</button>`).join("")}
function media(p){
 if(p.type==="photo")return p.src?`<img src="${esc(p.src)}" alt="${esc(p.alt||p.title)}">`:"";
 if(p.type==="audio")return p.src?`<audio controls src="${esc(p.src)}"></audio>`:`<p class="meta">(No audio file added yet)</p>`;
 if(p.type==="video")return p.src?`<video controls src="${esc(p.src)}"></video>`:`<p class="meta">(No video file added yet)</p>`;
 if(p.type==="link")return (p.links||[]).map(([t,u])=>`<a class="linkcard" href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}<br><small>${esc(u)}</small></a>`).join("");
 return "";
}
function render(){
 const q=$("q").value.trim().toLowerCase(),ty=$("type").value,so=$("sort").value;
 let r=POSTS.filter(p=>(!ty||p.type===ty)&&(!tag||p.tags.includes(tag))&&(!q||(p.title+" "+p.text+" "+p.tags.join(" ")).toLowerCase().includes(q)));
 r.sort((a,b)=>so==="new"?b.date.localeCompare(a.date):a.date.localeCompare(b.date));
 $("count").textContent=r.length+" post"+(r.length===1?"":"s");
 $("empty").style.display=r.length?"none":"block";
 $("list").innerHTML=r.map(p=>{
  const paras=p.text.split(/\n\n+/).map(x=>`<p>${esc(x)}</p>`).join("");
  return `<article id="post-${p.id}"><h2>${esc(p.title)}</h2><div class="meta"><span class="type">${p.type}</span>${new Date(p.date+"T00:00").toLocaleDateString(undefined,{year:"numeric",month:"long",day:"numeric"})} · ${p.tags.map(t=>"#"+esc(t)).join(" ")}</div>${media(p)}<div class="body">${paras}</div><button class="more"><span class="more-t"></span></button></article>`}).join("");
 renderChips();
}
$("q").oninput=render;$("type").onchange=render;$("sort").onchange=render;
$("chips").onclick=e=>{const t=e.target.dataset.t;if(!t)return;tag=t==="all"?"":t;render()};
$("list").onclick=e=>{const b=e.target.closest(".more");if(b)b.parentElement.classList.toggle("open")};
$("theme").onclick=e=>{e.preventDefault();const d=document.documentElement,dark=getComputedStyle(document.body).backgroundColor==="rgb(23, 21, 19)";d.dataset.theme=dark?"light":"dark"};
render();
</script>
</body>
</html>
